# =============================================================================
# nuget-publishing.yml — Unified ONNX Runtime GenAI packaging pipeline (Phase 5).
#
# NOTE: this file is temporarily named `nuget-publishing.yml` so it can reuse the
# already-registered pipeline (id 1385) for validation. It should be renamed back
# to `packaging.yml` (and a fresh pipeline registered) before merge. See the
# "Rename nuget-publishing.yml back to packaging.yml" todo.
#
# Single entry point that builds the core once per (EP, os, arch) and layers the
# SDKs (Python, C#, Java) incrementally against the prebuilt core, plus the
# bespoke Apple (iOS xcframework) and Android (AAR) artifacts and the .Foundry
# NuGet. Feed-isolated to the internal Lotus feed; every published binary/package
# is ESRP-signed where the platform supports it.
#
# The matrix is fixed per EP (goal 8); the pipeline inputs only select the EP(s),
# the build-time ORT versions, and the CUDA toolkit version:
#   CPU  : win-x64, win-arm64, macos-arm64, linux-x64, linux-arm64, android, ios
#   CUDA : win-x64, win-arm64, linux-x64
# =============================================================================

parameters:
# ---- EP selection ----------------------------------------------------------
- name: enable_cpu
  displayName: 'Build CPU EP (win/mac/linux + android/ios)'
  type: boolean
  default: true
- name: enable_cuda
  displayName: 'Build CUDA EP (win-x64/arm64 + linux-x64)'
  type: boolean
  default: true

# ---- Build-time ORT versions (from the Lotus feed) -------------------------
- name: ort_version_cpu
  displayName: 'ORT version (CPU build, --ort_home)'
  type: string
  default: '1.26.0'
- name: ort_version_cuda
  displayName: 'ORT version (CUDA build, --ort_home)'
  type: string
  default: '1.26.0'

# ---- CUDA toolkit version --------------------------------------------------
- name: cuda_version
  displayName: 'CUDA toolkit version'
  type: string
  default: '13.1'
  values:
    - '13.1'
    - '12.8'

# ---- NuGet versioning ------------------------------------------------------
- name: nuget_version_type
  displayName: 'NuGet version type'
  type: string
  default: 'stable'
  values:
    - 'stable'
    - 'dev'

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

trigger: none

variables:
- template: lotus-feed-variables.yml

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: 'onnxruntime-Win-CPU-2022'
      os: windows
    sdl:
      policheck:
        enabled: true
        break: true
        exclusionsFile: '$(Build.SourcesDirectory)\.pipelines\policheck_exclusions.xml'
      tsa:
        enabled: true
        configFile: '$(Build.SourcesDirectory)\.config\tsaoptions.json'
    stages:
    # ---- Core (native) -----------------------------------------------------
    - template: stages/core-packaging-stage.yml
      parameters:
        ort_version_cpu: ${{ parameters.ort_version_cpu }}
        ort_version_cuda: ${{ parameters.ort_version_cuda }}
        cuda_version: ${{ parameters.cuda_version }}
        enable_cpu: ${{ parameters.enable_cpu }}
        enable_cuda: ${{ parameters.enable_cuda }}

    # ---- iOS xcframework (bespoke Apple build; CPU) ------------------------
    - template: stages/ios-xcframework-stage.yml
      parameters:
        enable_cpu: ${{ parameters.enable_cpu }}

    # ---- Android AAR (bespoke Android build; CPU) -------------------------
    - template: stages/android-aar-stage.yml
      parameters:
        ort_version: ${{ parameters.ort_version_cpu }}
        enable_cpu: ${{ parameters.enable_cpu }}

    # ---- SDK · Python ------------------------------------------------------
    - template: stages/sdk-python-stage.yml
      parameters:
        ort_version_cpu: ${{ parameters.ort_version_cpu }}
        ort_version_cuda: ${{ parameters.ort_version_cuda }}
        cuda_version: ${{ parameters.cuda_version }}
        enable_cpu: ${{ parameters.enable_cpu }}
        enable_cuda: ${{ parameters.enable_cuda }}

    # ---- SDK · C# (NuGet) --------------------------------------------------
    - template: stages/sdk-csharp-stage.yml
      parameters:
        ort_version_cpu: ${{ parameters.ort_version_cpu }}
        ort_version_cuda: ${{ parameters.ort_version_cuda }}
        nuget_version_type: ${{ parameters.nuget_version_type }}
        enable_cpu: ${{ parameters.enable_cpu }}
        enable_cuda: ${{ parameters.enable_cuda }}

    # ---- SDK · Java (desktop jar; CPU) ------------------------------------
    - template: stages/sdk-java-stage.yml
      parameters:
        ort_version_cpu: ${{ parameters.ort_version_cpu }}
        enable_cpu: ${{ parameters.enable_cpu }}

    # ---- SDK · .Foundry (built when both CPU and CUDA are enabled) ---------
    - template: stages/foundry-packaging-stage.yml
      parameters:
        nuget_version_type: ${{ parameters.nuget_version_type }}
        enable_cpu: ${{ parameters.enable_cpu }}
        enable_cuda: ${{ parameters.enable_cuda }}
