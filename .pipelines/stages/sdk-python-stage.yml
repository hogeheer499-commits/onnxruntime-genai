# =============================================================================
# sdk-python-stage.yml — Python SDK (wheel) stage (Phase 3).
#
# Builds one wheel per platform of each enabled EP, incrementally against the
# prebuilt core. Fixed platform matrix per EP:
#   CPU  — win-x64, win-arm64, linux-x64, linux-arm64
#   CUDA — win-x64, win-arm64, linux-x64
# (No macOS wheel yet — follow-up.)
#
# NOTE on granularity: ADO job dependencies are within a stage, so this SDK stage
# depends on the whole Core stage(s) it consumes (not per-core-job). This keeps
# the clean Core·/SDK· separation at the cost of waiting for all core jobs of the
# enabled EP(s) to finish. Acceptable for the packaging cadence.
#
# Display-name convention:
#   Stage:  SDK · Python
#   Jobs:   python · <os>-<arch> · <ep>   (set by sdk-python-job.yml)
# =============================================================================

parameters:
- name: ort_version_cpu
  type: string
- name: ort_version_cuda
  type: string
- name: cuda_version
  type: string
  default: '13.1'

- name: enable_cpu
  type: boolean
  default: true
- name: enable_cuda
  type: boolean
  default: true

stages:
- stage: sdk_python
  displayName: 'SDK · Python'
  # Depend only on the core stage(s) this stage actually consumes.
  dependsOn:
  - ${{ if eq(parameters.enable_cpu, true) }}:
    - core_cpu
  - ${{ if eq(parameters.enable_cuda, true) }}:
    - core_cuda
  jobs:

  # ---- CPU wheels ----------------------------------------------------------
  - ${{ if eq(parameters.enable_cpu, true) }}:
    - template: jobs/sdk-python-job.yml
      parameters:
        os: win
        arch: x64
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}
    - template: jobs/sdk-python-job.yml
      parameters:
        os: win
        arch: arm64
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}
    - template: jobs/sdk-python-job.yml
      parameters:
        os: linux
        arch: x64
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}
    - template: jobs/sdk-python-job.yml
      parameters:
        os: linux
        arch: arm64
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}

  # ---- CUDA wheels ---------------------------------------------------------
  - ${{ if eq(parameters.enable_cuda, true) }}:
    - template: jobs/sdk-python-job.yml
      parameters:
        os: win
        arch: x64
        ep: cuda
        cuda_version: ${{ parameters.cuda_version }}
        ort_version: ${{ parameters.ort_version_cuda }}
    - template: jobs/sdk-python-job.yml
      parameters:
        os: win
        arch: arm64
        ep: cuda
        cuda_version: ${{ parameters.cuda_version }}
        ort_version: ${{ parameters.ort_version_cuda }}
    - template: jobs/sdk-python-job.yml
      parameters:
        os: linux
        arch: x64
        ep: cuda
        cuda_version: ${{ parameters.cuda_version }}
        ort_version: ${{ parameters.ort_version_cuda }}
