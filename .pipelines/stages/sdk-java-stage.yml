# =============================================================================
# sdk-java-stage.yml — Java SDK (desktop JVM jar) stage (Phase 3).
#
# Builds one desktop jar per Linux CPU platform, incrementally against the
# prebuilt core. Java is CPU-only here; Windows/macOS desktop jars and the
# Android AAR are follow-ups. Fixed platform matrix:
#   CPU — linux-x64, linux-arm64
#
# Display-name convention:
#   Stage:  SDK · Java
#   Jobs:   java · <os>-<arch> · <ep>   (set by sdk-java-job.yml)
# =============================================================================

parameters:
- name: ort_version_cpu
  type: string
- name: enable_cpu
  type: boolean
  default: true

stages:
# Java only builds CPU targets, so it is emitted only when the CPU EP is enabled.
- ${{ if eq(parameters.enable_cpu, true) }}:
  - stage: sdk_java
    displayName: 'SDK · Java'
    dependsOn:
    - core_cpu
    jobs:
    - template: jobs/sdk-java-job.yml
      parameters:
        os: linux
        arch: x64
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}
    - template: jobs/sdk-java-job.yml
      parameters:
        os: linux
        arch: arm64
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}
