# =============================================================================
# sdk-csharp-stage.yml — C# NuGet SDK stage (Phase 3).
#
# One combine job per enabled EP (cpu, cuda). Each job depends on the core stage
# for that EP and combines all RID core archives of that EP into the native +
# managed NuGet packages. Fixed platform matrix per EP:
#   CPU  — win-x64, win-arm64, linux-x64, linux-arm64
#   CUDA — win-x64, win-arm64, linux-x64
#
# Display-name convention:
#   Stage:  SDK · C#
#   Jobs:   csharp · nuget · <ep>   (set by sdk-csharp-job.yml)
# =============================================================================

parameters:
- name: ort_version_cpu
  type: string
- name: ort_version_cuda
  type: string
- name: build_config
  type: string
  default: Release

- name: enable_cpu
  type: boolean
  default: true
- name: enable_cuda
  type: boolean
  default: true

stages:
- stage: sdk_csharp
  displayName: 'SDK · C#'
  # Depend on the version stage (shared package version) + the core stage(s) this
  # stage actually consumes.
  dependsOn:
  - version
  - ${{ if eq(parameters.enable_cpu, true) }}:
    - core_cpu
  - ${{ if eq(parameters.enable_cuda, true) }}:
    - core_cuda
  # Shared package version computed once by the 'version' stage.
  variables:
  - name: genai_version
    value: $[ stageDependencies.version.set_version.outputs['setver.genai_version'] ]
  jobs:

  # ---- CPU combine job -----------------------------------------------------
  - ${{ if eq(parameters.enable_cpu, true) }}:
    - template: jobs/sdk-csharp-job.yml
      parameters:
        ep: cpu
        ort_version: ${{ parameters.ort_version_cpu }}
        build_config: ${{ parameters.build_config }}
        enable_win_x64: true
        enable_win_arm64: true
        enable_linux_x64: true
        enable_linux_arm64: true

  # ---- CUDA combine job ----------------------------------------------------
  - ${{ if eq(parameters.enable_cuda, true) }}:
    - template: jobs/sdk-csharp-job.yml
      parameters:
        ep: cuda
        ort_version: ${{ parameters.ort_version_cuda }}
        build_config: ${{ parameters.build_config }}
        enable_win_x64: true
        enable_win_arm64: true
        enable_linux_x64: true
        enable_linux_arm64: false
