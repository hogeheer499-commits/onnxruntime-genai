# =============================================================================
# foundry-packaging-stage.yml — .Foundry NuGet stage (Phase 4).
#
# Repackages the prebuilt core native binaries into the fixed-name NuGet package
# Microsoft.ML.OnnxRuntimeGenAI.Foundry. Unlike the standard native NuGet, the
# .Foundry package carries NO ONNX Runtime dependency (the host supplies ORT).
#
# The package bundles a fixed RID→EP mapping (matching the historical .Foundry):
#   win-x64, win-arm64, linux-x64  → cuda
#   osx-arm64, linux-arm64         → cpu
# so it is only emitted when BOTH the CPU and CUDA EPs are built.
#
# Display-name convention:
#   Stage:  SDK · .Foundry
#   Job:    foundry · nuget   (set by foundry-packaging-job.yml)
# =============================================================================

parameters:
- name: nuget_version_type
  type: string
  default: 'stable'
- name: enable_cpu
  type: boolean
  default: true
- name: enable_cuda
  type: boolean
  default: true

stages:
# The .Foundry package needs both CPU (osx-arm64, linux-arm64) and CUDA
# (win-x64, win-arm64, linux-x64) core archives, so build it only when both EPs
# are enabled.
- ${{ if and(eq(parameters.enable_cpu, true), eq(parameters.enable_cuda, true)) }}:
  - stage: sdk_foundry
    displayName: 'SDK · .Foundry'
    dependsOn:
    - core_cpu
    - core_cuda
    jobs:
    - template: jobs/foundry-packaging-job.yml
      parameters:
        nuget_version_type: ${{ parameters.nuget_version_type }}
